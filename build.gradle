plugins {
    id 'java'
    id 'application'
}

group = 'com.loan12suquan.hd'
version = '2.0.0-HD'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    gdxVersion = project.property('gdxVersion')
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'com.loan12suquan.hd.DesktopLauncher'
}

run {
    workingDir = project.projectDir
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Xms256m', '-Xmx1024m']
}

jar {
    archiveBaseName = 'Loan12SuQuan-HD'
    archiveVersion = '2.0.0'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.loan12suquan.hd.DesktopLauncher'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
